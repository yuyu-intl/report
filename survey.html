<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>說明會回饋問卷｜預約免費場勘</title>
<meta property="og:title" content="BM系列廚餘全去化處理機說明會｜回饋問卷＋預約免費場勘">
<meta property="og:description" content="感謝蒞臨！填寫問卷並預約免費場勘與報價">
<meta property="og:image" content="https://yuyu-intl.github.io/report/poster.jpg">
<style>
  :root{--g:#5AAF48;--b:#047EB1;--deep:#1f3b57;--gold:#a8823c;--bd:#d6e2e8;--tx:#1b2a33;--mu:#64737d;--red:#c0392b;--bg:#f6f3ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
  .hero{background:linear-gradient(160deg,#1f3b57,#2c5272);color:#fff;padding:22px 18px 26px;text-align:center}
  .hero .org{font-size:13px;opacity:.85;letter-spacing:1px}
  .hero .tag{display:inline-block;margin-top:10px;background:#f1e3c4;color:#5c4210;border-radius:20px;padding:3px 14px;font-size:13px;font-weight:600}
  .hero h1{margin:10px 0 4px;font-size:24px;letter-spacing:1px;line-height:1.35}
  .hero h1 em{font-style:normal;color:#e8c77d}
  .hero .sub{font-size:14px;opacity:.9}
  .poster.hidden{display:none}
  .poster:not(.hidden)+main{margin-top:12px}
  .poster{max-width:560px;margin:0 auto;padding:12px 14px 0}
  .poster img{display:block;width:100%;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  main{max-width:560px;margin:-14px auto 0;padding:0 14px 40px}
  .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--deep);display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--gold)}
  .info div{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--bd);font-size:15px}
  .info div:last-child{border-bottom:0}
  .info b{flex:0 0 48px;color:var(--mu);font-weight:400}
  .feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .feat span{background:#f4f8fa;border-radius:8px;padding:8px 4px;text-align:center;font-size:13px;color:var(--deep)}
  label{display:block;font-size:14px;margin:12px 0 4px}
  label .req{color:var(--red)}
  input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--b);border-color:transparent}
  textarea{min-height:64px}
  .row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
  .btn.line{display:block;box-sizing:border-box;text-align:center;text-decoration:none;background:#06C755;color:#fff;margin:4px 0 10px}
  .btn.line.hidden{display:none}
  .hint{font-size:12px;color:var(--mu);margin-top:4px;line-height:1.5}
  .consent{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.55;margin-top:6px}
  .consent input{width:auto;margin-top:3px}
  .btn{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(90deg,var(--g),var(--b));color:#fff;font-size:16px;font-weight:600;margin-top:4px}
  .btn:disabled{opacity:.5}
  .ref{background:#eef8ec;border:1px solid #cfe9c8;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
  .closed{background:#fdecea;color:var(--red);border-radius:8px;padding:12px;text-align:center;font-weight:600}
  .done{text-align:center;padding:28px 16px}
  .done .ic{font-size:46px}
  .done p{line-height:1.7}
  .call{display:block;text-align:center;text-decoration:none;margin-top:10px}
  .foot{font-size:12px;color:var(--mu);text-align:center;line-height:1.6;margin-top:6px}
  .hp{position:absolute;left:-9999px}
  .center{text-align:center;color:var(--mu);padding:30px 0}
  .hidden{display:none}
</style>
<style>
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .opts label{margin:0;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:20px;padding:7px 12px;font-size:14px;background:#fff;cursor:pointer}
  .opts input{width:auto;margin:0}
  .opts label.on{border-color:var(--b);background:#eaf5fb;color:var(--deep);font-weight:600}
  .stars{display:flex;gap:6px}
  .stars button{flex:1;padding:10px 0;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:15px;color:var(--tx)}
  .stars button.on{background:var(--deep);color:#fff;border-color:var(--deep)}
  .calc{background:#f4f8fa;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px;line-height:1.6}
  .calc b{color:var(--b);font-size:18px}
  .yn{display:flex;gap:8px}
  .yn button{flex:1;padding:12px 0;border:1px solid var(--bd);border-radius:10px;background:#fff;font-size:15px;color:var(--tx)}
  .yn button.on{background:linear-gradient(90deg,var(--g),var(--b));color:#fff;border:0;font-weight:600}
  .slots label{border-radius:8px}
  .sec{font-size:12px;color:var(--gold);letter-spacing:1px;font-weight:700;margin-bottom:2px}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="org">御宇國際企業有限公司</div>
  <div class="tag">感謝您今日蒞臨</div>
  <h1>說明會回饋問卷<br><em>＋ 預約免費場勘</em></h1>
  <div class="sub" id="evName">BM 系列廚餘全去化處理機說明會</div>
</div>
<main>
  <div id="closedBox" class="card hidden"><div class="closed" id="closedMsg"></div>
    <a class="btn call" href="tel:+886921899383">洽詢專線 0921-899-383</a></div>
  <div id="loading" class="card center">讀取中…</div>

  <form id="f" class="hidden" autocomplete="on" novalidate>
    <div class="card">
      <div class="sec">A</div><h2>基本資料</h2>
      <div class="ref hidden" id="lineBox"></div>
      <a class="btn line hidden" id="lineBtn" href="#">用 LINE 帶入資料</a>
      <label>公司／機構名稱 <span class="req">*</span></label><input name="company" required autocomplete="organization">
      <div class="row">
        <div><label>出席人姓名 <span class="req">*</span></label><input name="name" required autocomplete="name"></div>
        <div><label>職稱</label><input name="title" placeholder="例：總務經理"></div>
      </div>
      <label>手機 <span class="req">*</span></label><input name="phone" inputmode="tel" required placeholder="09xxxxxxxx" autocomplete="tel">
      <div class="hint">請填報名時的手機，系統會自動對應您的報名資料。</div>
    </div>

    <div class="card">
      <div class="sec">B</div><h2>說明會回饋</h2>
      <label>整體滿意度 <span class="req">*</span></label>
      <div class="stars" id="sat"><button type="button" data-v="1">1</button><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button><button type="button" data-v="5">5</button></div>
      <div class="hint">1＝不滿意　5＝非常滿意</div>
      <label>最感興趣的重點（可複選）</label><div class="opts" id="interest"></div>
      <label>導入的主要顧慮（可複選）</label><div class="opts" id="concern"></div>
      <input name="concernOther" id="concernOther" class="hidden" placeholder="其他顧慮，請說明" style="margin-top:8px">
    </div>

    <div class="card">
      <div class="sec">C</div><h2>目前廚餘狀況</h2>
      <div class="row">
        <div><label>每月廚餘量（公斤）</label><input name="kg" inputmode="numeric" placeholder="例：3000"></div>
        <div><label>每月清運費（元）</label><input name="fee" inputmode="numeric" placeholder="例：24000"></div>
      </div>
      <div class="calc hidden" id="calc"></div>
    </div>

    <div class="card">
      <div class="sec">D</div><h2>預約免費場勘</h2>
      <div class="hint" style="margin:0 0 10px">專人到場評估放置空間、水電與排水銜接，並提供正式報價。留下聯絡人與電話，將由專人與您聯繫安排時間。</div>
      <div class="yn" id="yn"><button type="button" data-v="1">要，預約場勘</button><button type="button" data-v="0">暫時不用</button></div>
      <div id="bookBox" class="hidden">
        <div class="row">
          <div><label>聯絡人 <span class="req">*</span></label><input name="contact" autocomplete="name"></div>
          <div><label>聯絡電話 <span class="req">*</span></label><input name="tel" inputmode="tel" autocomplete="tel"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="sec">E</div><h2>其他意見</h2>
      <textarea name="note" placeholder="選填，任何問題或建議都歡迎留言"></textarea>
      <input class="hp" name="website" tabindex="-1" autocomplete="off">
      <button class="btn" id="btn" type="submit" style="margin-top:14px">送出問卷</button>
    </div>
  </form>

  <div id="done" class="card done hidden"><div class="ic" id="doneIc">✅</div><p id="doneMsg"></p>
    <a class="btn call" href="tel:+886921899383">洽詢專線 0921-899-383</a></div>

  <div class="foot">主辦：御宇國際企業有限公司｜洽詢專線 0921-899-383</div>
</main>
<script>
const LIFF_ID = '2012023290-1MVnfTqT';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxlbCTV9QIBRMLnBoHAtrgpO8H3mH2jJ9KfRxBtK9QyvbpzUGsRrbWPDOh3h5q0QHN-/exec';
const q = new URLSearchParams(location.search);
const EVENT = q.get('e') || '20261112';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let SAT = 0, BOOK = null;
async function call(action, data) {
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, data }) });
  return res.json();
}
function opts(box, list, name) {
  $(box).innerHTML = list.map(x => '<label><input type="checkbox" name="' + name + '" value="' + esc(x) + '">' + esc(x) + '</label>').join('');
}
document.addEventListener('change', e => {
  const c = e.target;
  if (c.type !== 'checkbox') return;
  if (c.name === 'slots' && c.checked && document.querySelectorAll('input[name=slots]:checked').length > 2) { c.checked = false; alert('最多選 2 個時段'); }
  c.parentNode.classList.toggle('on', c.checked);
  if (c.name === 'concern' && c.value === '其他') $('#concernOther').classList.toggle('hidden', !c.checked);
});
$('#sat').onclick = e => { const b = e.target.closest('button'); if (!b) return; SAT = +b.dataset.v;
  [...$('#sat').children].forEach(x => x.classList.toggle('on', +x.dataset.v <= SAT)); };
$('#yn').onclick = e => { const b = e.target.closest('button'); if (!b) return; BOOK = b.dataset.v === '1';
  [...$('#yn').children].forEach(x => x.classList.toggle('on', x === b)); $('#bookBox').classList.toggle('hidden', !BOOK);
  const f = $('#f');   // 聯絡人／電話預設帶出席人資料，可修改
  if (BOOK && !f.contact.value) f.contact.value = f.name.value;
  if (BOOK && !f.tel.value) f.tel.value = f.phone.value; };
function calc() {
  const kg = +$('#f').kg.value.replace(/[^\d.]/g, '') || 0, fee = +$('#f').fee.value.replace(/[^\d.]/g, '') || 0;
  if (!kg || !fee) { $('#calc').classList.add('hidden'); return; }
  $('#calc').innerHTML = '目前每公斤處理費約 <b>' + (Math.round(fee / kg * 10) / 10).toLocaleString() + '</b> 元／公斤<br>' +
    '每日約 ' + Math.round(kg / 30).toLocaleString() + ' 公斤（以 30 天計）｜一年清運費約 ' + (fee * 12).toLocaleString() + ' 元';
  $('#calc').classList.remove('hidden');
}
['kg', 'fee'].forEach(n => $('#f')[n].addEventListener('input', calc));
(async function init() {
  try {
    const r = await call('surveyInfo', { event: EVENT });
    $('#loading').classList.add('hidden');
    if (!r.ok) { $('#closedMsg').textContent = r.message; $('#closedBox').classList.remove('hidden'); return; }
    $('#evName').textContent = r.event.name;
    if (r.closed) { $('#closedMsg').textContent = r.closed; $('#closedBox').classList.remove('hidden'); return; }
    opts('#interest', r.interest, 'interest'); opts('#concern', r.concern, 'concern');
    $('#f').classList.remove('hidden');
    lineFill();
  } catch (err) { $('#loading').textContent = '連線失敗，請稍後重新整理，或來電 0921-899-383。'; }
})();
let LINE = null;
function lineFill() {
  try { LINE = JSON.parse(sessionStorage.getItem('yyLine') || 'null'); } catch (e) {}
  if (LINE && LINE.exp && LINE.exp * 1000 < Date.now()) LINE = null;
  const f = $('#f');
  if (!LINE) return;   // 客戶問卷：不顯示 LINE 登入按鈕，避免進入報備系統
  if (LINE.name && !f.name.value) f.name.value = LINE.name;
  $('#lineBox').textContent = '已帶入 LINE 資料：' + (LINE.name || '') + '，請確認後補齊其餘欄位。';
  $('#lineBox').classList.remove('hidden');
}
$('#f').onsubmit = async e => {
  e.preventDefault();
  const f = $('#f'), fd = new FormData(f);
  const data = { company: fd.get('company'), name: fd.get('name'), title: fd.get('title'), phone: fd.get('phone'),
    sat: SAT, interest: fd.getAll('interest'), concern: fd.getAll('concern'), concernOther: fd.get('concernOther'),
    kg: String(fd.get('kg')).replace(/[^\d.]/g, ''), fee: String(fd.get('fee')).replace(/[^\d.]/g, ''),
    book: BOOK === true, contact: fd.get('contact'), tel: fd.get('tel'),
    note: fd.get('note'), website: fd.get('website'), event: EVENT };
  const need = { company: '公司名稱', name: '出席人姓名', phone: '手機' };
  for (const k in need) if (!String(data[k] || '').trim()) { alert('請填寫「' + need[k] + '」'); f[k].focus(); return; }
  if (!/^09\d{8}$/.test(data.phone.replace(/\D/g, ''))) { alert('手機格式不正確（09 開頭 10 碼）'); f.phone.focus(); return; }
  if (!SAT) { alert('請選擇說明會整體滿意度'); $('#sat').scrollIntoView({ block: 'center' }); return; }
  if (BOOK === null) { alert('請選擇是否預約免費場勘'); $('#yn').scrollIntoView({ block: 'center' }); return; }
  if (BOOK && !String(data.contact || '').trim()) { alert('請填寫聯絡人'); f.contact.focus(); return; }
  if (BOOK && String(data.tel || '').replace(/\D/g, '').length < 8) { alert('請填寫聯絡電話'); f.tel.focus(); return; }
  if (LINE && LINE.idToken) data.idToken = LINE.idToken;
  const btn = $('#btn'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const r = await call('surveySubmit', data);
    if (!r.ok) { alert(r.message); return; }
    $('#doneIc').textContent = r.book ? '📅' : '✅';
    $('#doneMsg').textContent = r.message;
    f.classList.add('hidden'); $('#done').classList.remove('hidden'); window.scrollTo(0, 0);
  } catch (err) { alert('連線失敗，請稍後再試，或來電 0921-899-383'); }
  finally { btn.disabled = false; btn.textContent = '送出問卷'; }
};
</script>
</body>
</html>
